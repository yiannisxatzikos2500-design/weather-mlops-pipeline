<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Pipeline Results</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        pre { background: #eee; padding: 15px; overflow-x: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🌤️ Daily Weather Pipeline</h1>
    
    <div class="card">
        <h2>📜 Today's Poem</h2>
        <div id="poem">Loading poem...</div>
    </div>

    <div class="card">
        <h2>📊 Weather Data (JSON)</h2>
        <pre id="weather">Loading data...</pre>
    </div>

    <script>
        // Fetches the poem generated by your Python script
        fetch("docs/poem.txt")
            .then(res => res.text())
            .then(data => document.getElementById("poem").innerText = data)
            .catch(e => document.getElementById("poem").innerText = "Poem not found yet. Run the pipeline first!");

        // Fetches the weather data
        fetch("docs/weather.json")
            .then(res => res.json())
            .then(data => document.getElementById("weather").innerText = JSON.stringify(data, null, 2))
            .catch(e => document.getElementById("weather").innerText = "Data not found.");
    </script>
</body>
</html>
